<body>
    <header>
        <a href="./index.html" aria-label="Vinculo al inicio">
            <img src="./recursos/imagenes/mascotas.png" alt="Logo huellitas">

            </a>
        </nav>
    </header>
    <main>
        <h1>Contacto</h1>
        <h2>Escribinos</h2>
        <form action="./contacto.html" method="post">

            <label for="id-nombre">Nombre</label>
            <input type="text" name="nombre" id="id-nombre">

            <label for="id-email">Email</label>
            <input type="email" name="email" id="id-email">

            <label for="id-tipo-mascota">Tipo mascota</label>
            <select name="tipo-mascota" id="id-tipo-mascota">
                <option value="perro">Perro</option>
                <option value="gato">Gato</option>
                <option value="ave">Ave</option>
            </select>

            <label for="id-comentario">Comentario</label>
            <textarea name="comentario" id="id-comentario"></textarea>
            <!-- -- -->
            <button type="reset">Limpiar</button>
            <button type="submit">Enviar</button>
            <!-- <input type="button" value="Enviar"> -->
        </form>
        <h2>Dónde estamos</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3404.8698411162436!2d-64.18888832428232!3d-31.417711996315624!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9432a28382167cfb%3A0x1ef3ae3cd0407f65!2sCaseros%20100%2C%20X5000AHD%20C%C3%B3rdoba!5e0!3m2!1ses-419!2sar!4v1788179977394!5m2!1ses-419!2sar" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </main>

        <ul>
            <li>
                <a href="https://instagram.com/huellitas">
                    @huellitas
                </a>    
            </li>
            <li>
                Caseros 100. Bº Centro. Córdoba Capital

        </ul>
    </footer>
</body>
</html>
